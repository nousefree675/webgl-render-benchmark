<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>webgl-render-benchmark</title><link rel="icon" href="data:,">
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
<style>html, body { margin: 0; background: #000; } #stage { display: block; width: 1280px; height: 720px; }</style>
</head><body>
<canvas id="stage" width="1280" height="720"></canvas>
<script type="module">
// Synthetic WebGL render benchmark scene. 100% original procedural content:
// no third-party models, textures or user project code. Deterministic in t so
// every frame costs the same regardless of when it is rendered.
import * as THREE from 'three';

const W = 1280, H = 720, FPS = 24;
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaebfd0);
scene.fog = new THREE.Fog(0xaebfd0, 60, 260);

const cam = new THREE.PerspectiveCamera(44, W / H, 0.1, 600);
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x4a5568, 0.9));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(-60, 80, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90; sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90; sun.shadow.camera.bottom = -90;
scene.add(sun);

// deterministic hash noise for terrain heights
const hash = (x, z) => { const s = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453; return s - Math.floor(s); };
const noise = (x, z) => {
  const xi = Math.floor(x), zi = Math.floor(z), xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = zf * zf * (3 - 2 * zf);
  return hash(xi, zi) * (1 - u) * (1 - v) + hash(xi + 1, zi) * u * (1 - v) + hash(xi, zi + 1) * (1 - u) * v + hash(xi + 1, zi + 1) * u * v;
};
const heightAt = (x, z) => 6 * noise(x / 28, z / 28) + 2.4 * noise(x / 9, z / 9) + 0.5 * noise(x / 2.7, z / 2.7);

const terrGeo = new THREE.PlaneGeometry(400, 400, 160, 160);
terrGeo.rotateX(-Math.PI / 2);
{ const p = terrGeo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  terrGeo.computeVertexNormals(); }
const terrain = new THREE.Mesh(terrGeo, new THREE.MeshStandardMaterial({ color: 0xe8eef4, roughness: 0.95 }));
terrain.receiveShadow = true; scene.add(terrain);

// mountains
const mtnMat = new THREE.MeshStandardMaterial({ color: 0xc7d3de, roughness: 1 });
for (let i = 0; i < 9; i++) {
  const m = new THREE.Mesh(new THREE.ConeGeometry(30 + 14 * hash(i, 7), 55 + 30 * hash(i, 3), 6), mtnMat);
  m.position.set(-220 + i * 55, 12, -190 - 40 * hash(i, 11)); m.castShadow = true; scene.add(m);
}
// tents
const tentCols = [0xe08a1c, 0x7f8f4c, 0xe08a1c, 0x9c4a2f];
for (let i = 0; i < 4; i++) {
  const t = new THREE.Mesh(new THREE.ConeGeometry(2.0, 1.6, 4), new THREE.MeshStandardMaterial({ color: tentCols[i], roughness: 0.8 }));
  t.position.set(-16 + i * 7, heightAt(-16 + i * 7, 6 + i * 3) + 0.8, 6 + i * 3);
  t.rotation.y = i * 0.7; t.castShadow = t.receiveShadow = true; scene.add(t);
}
// fire
const fire = new THREE.PointLight(0xff7a28, 60, 30, 2); fire.position.set(-8, heightAt(-8, 14) + 1, 14); scene.add(fire);

// walking figures (capsule body + head), deterministic walk cycle
const parka = [0xc94f36, 0x3f6d8e, 0x4c7a45, 0xb0892f, 0x6d4f8e, 0x8e3f5d];
const figures = [];
for (let i = 0; i < 6; i++) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.9, 6, 12), new THREE.MeshStandardMaterial({ color: parka[i], roughness: 0.9 }));
  body.position.y = 1.05; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), new THREE.MeshStandardMaterial({ color: 0xd9b08c, roughness: 0.7 }));
  head.position.y = 1.95; head.castShadow = true; g.add(head);
  const legL = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.6, 4, 8), new THREE.MeshStandardMaterial({ color: 0x3a3f45 }));
  const legR = legL.clone(); legL.position.set(-0.16, 0.45, 0); legR.position.set(0.16, 0.45, 0);
  legL.castShadow = legR.castShadow = true; g.add(legL, legR);
  g.userData = { legL, legR, phase: i * 1.1 };
  scene.add(g); figures.push(g);
}
// snow
const SNOW = 14000;
const snowPos = new Float32Array(SNOW * 3), snowSeed = new Float32Array(SNOW);
for (let i = 0; i < SNOW; i++) { snowPos[i * 3] = (hash(i, 1) - 0.5) * 240; snowPos[i * 3 + 1] = hash(i, 2) * 60; snowPos[i * 3 + 2] = (hash(i, 3) - 0.5) * 240; snowSeed[i] = hash(i, 4); }
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.35, sizeAttenuation: true, transparent: true, opacity: 0.85 }));
scene.add(snow);

window.total = 10;
window.renderAt = (t, n) => {
  const N = Math.max(1, n | 0);
  for (let k = 0; k < N; k++) {
    const tt = t + k / (N * FPS); // sub-frame offset; cost matches kit's n sub-frame renders
    figures.forEach((f, i) => {
      const px = -6 + i * 1.4 - tt * 0.9, pz = 24 + Math.sin(i * 2.1) * 3;
      f.position.set(px, heightAt(px, pz), pz);
      f.rotation.y = Math.PI / 2;
      const sw = Math.sin(tt * 6 + f.userData.phase) * 0.5;
      f.userData.legL.rotation.x = sw; f.userData.legR.rotation.x = -sw;
    });
    const sp = snow.geometry.attributes.position;
    for (let i = 0; i < SNOW; i++) {
      let y = snowSeed[i] * 60 - ((tt * (3 + snowSeed[i] * 4)) % 60); if (y < 0) y += 60;
      sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(tt + i) * 0.002);
    }
    sp.needsUpdate = true;
    fire.intensity = 55 + 18 * Math.sin(tt * 9) * Math.sin(tt * 3.7);
    cam.position.set(10 - tt * 1.2, 6.5 + Math.sin(tt * 0.4) * 1.2, 44 - tt * 2.0);
    cam.lookAt(-4, 3, 12);
    renderer.render(scene, cam);
  }
};
window.renderAt(0, 1); // warm up shaders outside measured frames
window.__ready = true;
</script>
</body></html>
